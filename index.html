
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Question...</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section id="intro" class="screen active">
        <p>THIS FALL...</p>
        <h1>ONE DANCE.</h1>
        <button onclick="showProposal()">Continue →</button>
    </section>

    <section id="proposal" class="screen">
        <div class="letter">
            <p class="small">A LITTLE MESSAGE...</p>

            <h1>Hey Kashani</h1>

            <p>
                There's something I've been wanting to ask you.
            </p>

            <p>
                I think this Homecoming could be pretty special.
            </p>

            <h2>Will you go with me?</h2>

            <div class="buttons">
                <button class="yes" onclick="sayYes()">YES ❤️</button>
                <button class="maybe" onclick="sayMaybe()">Maybe...</button>
            </div>
        </div>
    </section>

    <section id="yesScreen" class="screen">
        <h1>IT'S A DATE! 🎉</h1>
        <p>Homecoming is officially happening.</p>
    </section>

    <script src="sss.js"></script>

</body>
</html>
